<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover + safe-area padding in CSS keeps the board clear of the notch.
      user-scalable=no stops double-tap zoom from eating gameplay taps on a phone.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1410" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>BLOOM</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230d1410'/><rect x='6' y='2' width='4' height='12' fill='%233ddc6b'/><rect x='2' y='6' width='12' height='4' fill='%233ddc6b'/></svg>"
    />
    <link rel="stylesheet" href="/client/bloom.css" />
  </head>
  <body>
    <div id="overlay"></div>
    <noscript>
      <div class="noscript">BLOOM needs JavaScript.</div>
    </noscript>
    <script type="module" src="/client/main.ts"></script>
  </body>
</html>
